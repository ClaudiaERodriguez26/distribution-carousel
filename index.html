<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distribution Carousel</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px;
      background: white;
      color: #222;
    }

    .carousel {
      max-width: 900px;
      margin: auto;
    }

    .slide {
      display: none;
      text-align: center;
    }

    .slide.active {
      display: block;
    }

    .slide h2 {
      color: #00583d;
      font-size: 28px;
      margin-bottom: 20px;
    }

    .image-placeholder {
      background: #f3f3f3;
      padding: 60px 20px;
      margin: 20px auto;
      max-width: 500px;
      color: #666;
    }

    .text {
      border: 3px solid #a8d49f;
      padding: 20px;
      margin: 20px auto;
      max-width: 600px;
      font-size: 18px;
      line-height: 1.5;
    }

    .navigation {
      text-align: center;
      margin-top: 25px;
    }

    button {
      background: #f47721;
      color: white;
      border: none;
      padding: 12px 22px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #d95f0e;
    }
  </style>
</head>

<body>

  <div class="carousel">

    <div class="slide active">
      <h2>Selective Distribution</h2>

      <div class="image-placeholder">
        IMAGE 1 GOES HERE
      </div>

      <div class="text">
        Selective distribution uses carefully selected channels to reach customers.
