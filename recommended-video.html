<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<meta
  name="referrer"
  content="strict-origin-when-cross-origin">

<title>L'Oréal Recommended Video</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background: #ffffff;
}

body {
  padding: 20px;
}

/* MAIN ACTIVITY */

.recommended-video {
  width: 100%;
  max-width: 1150px;
  margin: 0 auto;
  padding: 28px;
  background: #eeeeee;
}

.layout {
  display: grid;
  grid-template-columns: 230px 1fr;
  align-items: stretch;
}

/* LEFT IMAGE AREA */

.icon-area {
  width: 230px;
  min-height: 330px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 25px;

  overflow: hidden;

  border-right: 5px solid #f47721;
}

/* YOUR VIDEO IMAGE - FIXED SIZE */

.video-icon-image {
  width: 170px !important;
  height: 170px !important;

  max-width: 170px !important;
  max-height: 170px !important;

  object-fit: contain;

  display: block;
}

/* RIGHT GREEN PANEL */

.content-panel {
  min-height: 330px;

  margin-left: 20px;
  padding: 30px;

  background: #075b3e;
  color: #ffffff;

  display: flex;
  flex-direction: column;
  justify-content: center;
}

/* HEADING */

.heading-box {
  margin-bottom: 20px;

  padding: 10px 15px;

  border: 3px solid #58a363;
}

.heading-box h1 {
  margin: 0;

  color: #ffffff;

  font-size: 30px;
  line-height: 1.2;
}

/* DESCRIPTION */

.description {
  margin: 0 0 24px;

  color: #ffffff;

  font-size: 19px;
  line-height: 1.5;
}

/* CLICKABLE VIDEO CARD */

.video-card {
  width: 100%;

  padding: 18px 20px;

  border: none;

  background: #b7dca9;
  color: #173e2c;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 18px;

  text-align: left;

  cursor: pointer;
}

.video-card:hover {
  background: #c9e6bd;
}

.video-card:focus {
  outline: 4px solid #f47721;
  outline-offset: 4px;
}

.video-card-text {
  font-size: 19px;
  line-height: 1.35;
  font-weight: bold;
}

/* PLAY CIRCLE */

.play-icon {
  width: 52px;
  height: 52px;

  flex: 0 0 52px;

  border-radius: 50%;

  background: #075b3e;
  color: #ffffff;

  display: flex;
  align-items: center;
  justify-content: center;

  padding-left: 4px;

  font-size: 23px;
}

/* VIDEO POPUP */

.modal {
  display: none;

  position: fixed;
  inset: 0;

  z-index: 1000;

  padding: 20px;

  background: rgba(0, 42, 37, 0.90);

  align-items: center;
  justify-content: center;
}

.modal.show {
  display: flex;
}

/* WHITE POPUP */

.modal-box {
  width: min(900px, 96%);

  max-height: 95vh;

  overflow-y: auto;

  padding: 25px;

  background: #ffffff;

  box-shadow: 0 10px 35px rgba(0,0,0,0.35);
}

/* POPUP TITLE */

.modal-title {
  margin: 0 0 20px;

  padding: 10px 14px;

  border: 3px solid #a8d49f;

  color: #075b3e;

  font-size: 25px;
  line-height: 1.25;
}

/* RESPONSIVE VIDEO */

.video-container {
  position: relative;

  width: 100%;

  padding-top: 56.25%;

  background: #000000;
}

.video-container iframe {
  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  border: 0;
}

/* SOURCE */

.source {
  margin-top: 15px;

  text-align: right;

  color: #075b3e;

  font-size: 15px;
}

/* YOUTUBE FALLBACK */

.youtube-link {
  margin-top: 12px;

  text-align: center;

  font-size: 15px;
}

.youtube-link a {
  color: #075b3e;
  font-weight: bold;
}

/* CLOSE BUTTON */

.close-area {
  margin-top: 22px;

  text-align: center;
}

.close-button {
  padding: 12px 32px;

  border: none;

  background: #f47721;
  color: #ffffff;

  font-size: 18px;
  font-weight: bold;

  cursor: pointer;
}

.close-button:hover {
  background: #d95f0e;
}

.close-button:focus {
  outline: 4px solid #075b3e;
  outline-offset: 3px;
}

/* MOBILE */

@media (max-width: 750px) {

  body {
    padding: 10px;
  }

  .recommended-video {
    padding: 18px;
  }

  .layout {
    grid-template-columns: 1fr;
  }

  .icon-area {
    width: 100%;
    min-height: 180px;

    border-right: none;
    border-bottom: 5px solid #f47721;
  }

  .video-icon-image {
    width: 140px !important;
    height: 140px !important;

    max-width: 140px !important;
    max-height: 140px !important;
  }

  .content-panel {
    min-height: 0;

    margin-left: 0;
    margin-top: 16px;

    padding: 24px 20px;
  }

  .heading-box h1 {
    font-size: 24px;
  }

  .description,
  .video-card-text {
    font-size: 17px;
  }

  .modal {
    padding: 8px;
  }

  .modal-box {
    width: 100%;
    padding: 15px;
  }

  .modal-title {
    font-size: 21px;
  }

}

</style>

</head>


<body>


<!-- RECOMMENDED VIDEO -->

<div class="recommended-video">

  <div class="layout">


    <!-- VIDEO IMAGE -->

    <div class="icon-area">

      <img
        src="video-play-icon.png"
        alt="Video play icon"
        class="video-icon-image">

    </div>


    <!-- GREEN PANEL -->

    <div class="content-panel">


      <div class="heading-box">

        <h1>
          RECOMMENDED VIDEO
        </h1>

      </div>


      <p class="description">

        Watch this video with L'Oréal's Chief Digital Officer
        Lubomira Rochet, where she discusses the digital
        transformations and marketing at L'Oréal.

      </p>


      <button
        class="video-card"
        id="openVideo"
        type="button">

        <span class="video-card-text">

          L'Oréal Chief Digital Officer on CNBC

        </span>


        <span
          class="play-icon"
          aria-hidden="true">

          ▶

        </span>

      </button>


    </div>

  </div>

</div>



<!-- VIDEO POPUP -->

<div
  class="modal"
  id="videoModal">

  <div class="modal-box">


    <h2 class="modal-title">

      L'Oréal Chief Digital Officer on CNBC

    </h2>


    <div class="video-container">

      <iframe
        id="youtubeVideo"
        src="about:blank"
        title="L'Oréal Chief Digital Officer on CNBC"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>

    </div>


    <div class="source">

      Source: (L'Oréal Groupe, 2019)

    </div>


    <div class="youtube-link">

      If the video does not display,

      <a
        href="https://www.youtube.com/watch?v=aMEsnLtFsU0"
        target="_blank"
        rel="noopener">

        watch it directly on YouTube

      </a>.

    </div>


    <div class="close-area">

      <button
        class="close-button"
        id="closeVideo"
        type="button">

        Close

      </button>

    </div>


  </div>

</div>



<script>

var modal =
  document.getElementById("videoModal");

var openButton =
  document.getElementById("openVideo");

var closeButton =
  document.getElementById("closeVideo");

var youtubeVideo =
  document.getElementById("youtubeVideo");


function openVideo() {

  youtubeVideo.src =
    "https://www.youtube.com/embed/aMEsnLtFsU0?playsinline=1&rel=0";

  modal.classList.add("show");

}


function closeVideo() {

  modal.classList.remove("show");

  youtubeVideo.src =
    "about:blank";

}


openButton.addEventListener(
  "click",
  openVideo
);


closeButton.addEventListener(
  "click",
  closeVideo
);


/* CLOSE WHEN CLICKING OUTSIDE THE WHITE POPUP */

modal.addEventListener(
  "click",
  function(event) {

    if (event.target === modal) {

      closeVideo();

    }

  }
);


/* CLOSE WITH ESCAPE KEY */

document.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Escape") {

      closeVideo();

    }

  }
);

</script>


</body>

</html>
