<title>Time Series Analysis Flip Card</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  font-family: Arial, sans-serif;
}

body {
  padding: 20px;
}

/* FLIP CARD CONTAINER */

.flip-card {
  width: 100%;
  max-width: 1100px;
  height: 500px;
  margin: 0 auto;
  perspective: 1400px;
}

.flip-inner {
  position: relative;
  width: 100%;
  height: 100%;

  transition: transform 0.7s ease;
  transform-style: preserve-3d;
}

.flip-card.flipped .flip-inner {
  transform: rotateY(180deg);
}

/* FRONT AND BACK */

.card-front,
.card-back {
  position: absolute;
  width: 100%;
  height: 100%;

  backface-visibility: hidden;

  overflow: hidden;
}
